# Server
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Optional local .env (key=value). Never commit the real .env file.
spring.config.import=optional:file:.env[.properties]

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ticketrush}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.locations=classpath:db/migration

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=3s
spring.data.redis.connect-timeout=3s

# JWT
jwt.secret=${JWT_SECRET:TicketRushSuperSecretKeyForJwtSigningMustBeAtLeast256BitsLongTicketRush2026!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Actuator / health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState,ping

# Application
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.websocket.allowed-origin-patterns=${WS_ALLOWED_ORIGINS:http://localhost:5173}
app.media.bucket=${MEDIA_BUCKET:ticketrush-media}
app.media.region=${MEDIA_REGION:ap-southeast-1}
app.media.endpoint=${MEDIA_ENDPOINT:}
app.media.public-endpoint=${MEDIA_PUBLIC_ENDPOINT:}
app.media.public-base-url=${MEDIA_PUBLIC_BASE_URL:}
app.media.path-style=${MEDIA_PATH_STYLE:false}
app.media.presign-expiry-minutes=${MEDIA_PRESIGN_EXPIRY_MINUTES:10}
app.media.max-image-bytes=${MEDIA_MAX_IMAGE_BYTES:5242880}
app.media.max-video-bytes=${MEDIA_MAX_VIDEO_BYTES:52428800}
app.qr.base-url=${QR_BASE_URL:/media/qr/qr_for_all.png}
app.bootstrap.admin.enabled=${APP_BOOTSTRAP_ADMIN:false}
app.bootstrap.admin.email=${ADMIN_EMAIL:}
app.bootstrap.admin.password=${ADMIN_PASSWORD:}
app.bootstrap.admin.reset-password=${ADMIN_RESET_PASSWORD:false}
