name: Deploy backend (manual, gated)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "deploy" to confirm
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: ticketrush-deploy-demo
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true' && inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    environment: demo
    env:
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test deployment orchestration
        run: python -m unittest discover -s tests -p test_deploy_backend.py -v

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          docker build -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" backend
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"

      - name: Deploy and await instance refresh
        env:
          PARAMETER_NAME: ${{ vars.IMAGE_TAG_PARAMETER }}
          ASG_NAME: ${{ vars.ASG_NAME }}
        run: python scripts/deploy_backend.py
