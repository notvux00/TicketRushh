name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test SPA routing
        run: node --test ../tests/spa_fallback.test.cjs
      - name: Test event time across timezones
        run: node --test ../tests/event_time.test.cjs
      - name: Build
        run: npm run build

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test rollout and recovery
        run: python -m unittest discover -s tests -p test_deploy_backend.py -v

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"
      - name: Format
        run: terraform fmt -check -recursive
      - name: Validate demo
        working-directory: infra/terraform/envs/demo
        run: terraform init -backend=false && terraform validate
      - name: Validate prod
        working-directory: infra/terraform/envs/prod
        run: terraform init -backend=false && terraform validate
