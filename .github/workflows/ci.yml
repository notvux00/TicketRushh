name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test utilities and SPA routing
        run: node --test ../tests/*.test.cjs
      - name: Install browser for session regression tests
        run: npx playwright install --with-deps chromium
      - name: Test sessions, checkout recovery and admin tools
        run: npm run test:browser
      - name: Build
        run: npm run build
      - name: Check entry bundle size
        run: |
          entry=$(ls dist/assets/index-*.js)
          size=$(stat -c%s "$entry")
          echo "entry=$entry bytes=$size"
          test "$size" -le 512000

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test deployment and recovery
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"
      - name: Format
        run: terraform fmt -check -recursive
      - name: Test bootstrap OIDC subjects
        working-directory: infra/terraform/bootstrap
        run: terraform init -backend=false && terraform test
      - name: Test ECR lifecycle contract
        working-directory: infra/terraform/modules/compute
        run: terraform init -backend=false && terraform test
      - name: Validate demo
        working-directory: infra/terraform/envs/demo
        run: terraform init -backend=false && terraform validate
      - name: Validate prod
        working-directory: infra/terraform/envs/prod
        run: terraform init -backend=false && terraform validate
