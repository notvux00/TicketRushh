name: Deploy frontend (manual, gated)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "deploy" to confirm
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true' && inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: /api
          VITE_WS_URL: ""
          VITE_MEDIA_BASE_URL: ""
        run: |
          npm ci
          npm run build

      - name: Sync static files
        env:
          BUCKET: ${{ vars.FRONTEND_BUCKET }}
        run: |
          aws s3 sync frontend/dist "s3://$BUCKET" --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp frontend/dist/index.html "s3://$BUCKET/index.html" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate index
        env:
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/" "/index.html"
