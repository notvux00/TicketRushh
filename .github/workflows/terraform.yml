name: Terraform (manual, gated)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: demo
        type: choice
        options: [demo, prod]
      confirm:
        description: Type "apply" to confirm
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  plan-apply:
    if: vars.DEPLOY_ENABLED == 'true' && inputs.confirm == 'apply'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: infra/terraform/envs/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"

      - name: Init
        run: terraform init

      - name: Plan
        run: terraform plan -out=tfplan

      - name: Apply
        run: terraform apply -auto-approve tfplan
