name: ticketrush

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ticketrush
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticketrush"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Lightweight S3-compatible API for local presigned upload tests.
  # MinIO images are not available from this environment's registry, so the
  # local profile uses Adobe S3Mock instead. Production uses real S3.
  s3mock:
    image: adobe/s3mock:latest
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ticketrush-media
    ports:
      - "9090:9090"
      - "9191:9191"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    profiles: ["app"]
    build:
      context: ./backend
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3mock:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/ticketrush
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-TicketRushSuperSecretKeyForJwtSigningMustBeAtLeast256BitsLongTicketRush2026!}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      WS_ALLOWED_ORIGINS: http://localhost:5173
      MEDIA_BUCKET: ticketrush-media
      MEDIA_REGION: ap-southeast-1
      MEDIA_ENDPOINT: http://s3mock:9090
      MEDIA_PUBLIC_ENDPOINT: http://localhost:9090
      MEDIA_PUBLIC_BASE_URL: http://localhost:9090/ticketrush-media
      MEDIA_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      APP_BOOTSTRAP_ADMIN: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_RESET_PASSWORD: "true"
      FLYWAY_ENABLED: "true"
      JPA_DDL_AUTO: validate

  frontend:
    profiles: ["app"]
    image: node:22
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_URL: /api
      VITE_WS_URL: ""
      VITE_MEDIA_BASE_URL: http://localhost:9090/ticketrush-media

volumes:
  postgres-data:
  redis-data:
  frontend-node-modules:
